spring.application.name=escudo-do-mestre
spring.datasource.url=jdbc:mysql://localhost:3306/escudo_do_mestre?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=refresh

eureka.client.service-url.defaultZone = http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=escudo-do-mestre
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=br.com.infnet.escudodomestre.listener.FichaEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=br.com.infnet.escudodomestre.events

topics.ficha-criada=ficha-criada
topics.ficha-excluida=ficha-excluida