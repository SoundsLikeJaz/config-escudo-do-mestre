spring.application.name=ficha-microservice
spring.datasource.url=jdbc:mysql://localhost:3306/escudo_do_mestre?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=refresh

eureka.client.service-url.defaultZone = http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties[spring.json.type.mapping]=fichaCriada:br.com.infnet.fichamicroservice.events.FichaCriadaEvent,fichaExcluida:br.com.infnet.fichamicroservice.events.FichaExcluidaEvent

topics.ficha-criada=ficha-criada
topics.ficha-excluida=ficha-excluida